services:
  - type: web
    name: weedicider-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "0"
      - key: DATA_DIR
        value: /tmp/weedicider
      - key: MAX_UPLOAD_MB
        value: "16"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_URL
        sync: false
